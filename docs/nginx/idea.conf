# Idea Manager 的 nginx 反代配置。
#
# 部署步骤与前置条件见 README.md 的「部署」一节，设计依据见
# docs/superpowers/specs/2026-11-11-idea-manager-design.md §16.3。
#
# 约定：
# - 应用只监听回环地址（IDEA_Urls，默认 http://127.0.0.1:5080），对外一律走 nginx。
# - 访问控制放在 nginx 层（basic auth），应用本身不做鉴权、也不做 Origin/CSRF 校验。
# - server_name / 证书路径 / htpasswd 路径按自己的域名改。

upstream idea_app {
    server 127.0.0.1:5080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;                       # nginx ≥ 1.25.1
    server_name ideas.example.com;

    ssl_certificate     /etc/letsencrypt/live/ideas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ideas.example.com/privkey.pem;

    # 访问控制放在 nginx 层，应用本身不做鉴权
    auth_basic           "Idea";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 请求体上限。这是**仓库自带的部署下 agent 实际会撞到的上限**（4MB）——
    # 比 Kestrel 的默认上限（30,000,000 字节）先撞上，走 nginx 的请求根本到不了 Kestrel。
    # 撞上时 413 是 **nginx 自己回的**，但响应体是**结构化 JSON**（见下面的 error_page），
    # 不是 nginx 默认的 HTML → CLI 报 `http_413: 请求体超过上限（nginx 的 client_max_body_size）。`
    # （直连 Kestrel 时响应体是空的 → CLI 报 `http_413: HTTP 413` —— **同一个码**。）
    # 改这个数字前先看 skills/idea-manager/SKILL.md 的「HTTP 413」说明，两边要一起改。
    client_max_body_size 4m;

    # 请求体超过上限 → 回一个**结构化**的 JSON（ProblemDetails 形状），
    # 而不是 nginx 默认的 HTML —— HTML 会让 agent 只能报 invalid_response，
    # 拿不到「是 body 太大」这个信号。
    #
    # **刻意不带 code 字段**：CLI 的 _error_for 遇到「有 JSON 但没有 code」的
    # 响应会合成 http_<状态码> → 与直连 Kestrel 时的空 body 路径**同一个码**
    # （http_413），agent 不必分支两条路径。
    #
    # 放在 server 层：这样所有 location（含下面的 SSE 段）都覆盖。
    error_page 413 = @idea_too_large;

    location @idea_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"请求失败","status":413,"detail":"请求体超过上限（nginx 的 client_max_body_size）。"}';
    }

    # SSE 单独一段：长连接 + 关缓冲，和普通请求不能用同一套超时设置。
    location /api/events {
        proxy_pass http://idea_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # SSE 必须关缓冲，否则实时推送会被攒着不发。
        proxy_buffering off;
        proxy_cache off;
        gzip off;                    # 压缩会重新引入缓冲，推送会变延迟

        # 应用侧也会带这个头（双保险）。这里由 nginx 统一发一份：
        # 上游漏了它的时候，缓冲不会被重新打开。
        proxy_hide_header X-Accel-Buffering;
        add_header X-Accel-Buffering no always;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # 前端用 history 模式，深链 /projects、/trash 等由应用侧的
        # MapFallbackToFile("index.html") 兜底，nginx 不需要 try_files
        proxy_pass http://idea_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
